[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spork-pds"
version = "0.1.0"
description = "Fast persistent data structures for Python"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Grant Wade", email = "grant@spork.sh"}
]
keywords = [
    "persistent-data-structures",
    "immutable",
    "functional-programming",
    "vector",
    "hamt",
    "structural-sharing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
dev = [
    "build>=1",
    "numpy",
    "pytest>=8",
    "setuptools>=77",
    "twine",
    "wheel",
]

[project.urls]
Homepage = "https://github.com/spork-it/spork-pds"
Documentation = "https://github.com/spork-it/spork-pds#readme"
Repository = "https://github.com/spork-it/spork-pds"
Issues = "https://github.com/spork-it/spork-pds/issues"
Changelog = "https://github.com/spork-it/spork-pds/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
