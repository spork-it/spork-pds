name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: >-
      Test on ${{ matrix.os }} (${{ matrix.architecture }}) -
      Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
          - windows-11-arm
          - macos-15-intel
          - macos-15
        python-version:
          ["3.10", "3.11", "3.12", "3.13", "3.13t", "3.14", "3.14t"]
        exclude:
          # actions/setup-python does not provide CPython 3.10 for Windows ARM64.
          - os: windows-11-arm
            python-version: "3.10"
        include:
          - os: ubuntu-latest
            architecture: x64
          - os: ubuntu-24.04-arm
            architecture: arm64
          - os: windows-latest
            architecture: x64
          - os: windows-11-arm
            architecture: arm64
          - os: macos-15-intel
            architecture: x64
          - os: macos-15
            architecture: arm64

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.architecture }}
          allow-prereleases: true

      - name: Set PYTHON_GIL=0 for free-threaded builds (Unix)
        if: endsWith(matrix.python-version, 't') && runner.os != 'Windows'
        run: echo "PYTHON_GIL=0" >> "$GITHUB_ENV"

      - name: Set PYTHON_GIL=0 for free-threaded builds (Windows)
        if: endsWith(matrix.python-version, 't') && runner.os == 'Windows'
        shell: pwsh
        run: echo "PYTHON_GIL=0" >> $env:GITHUB_ENV

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Build C extension
        run: python setup.py build_ext --inplace

      - name: Print host info
        run: python tools/host_info.py

      - name: Verify C extension loads
        run: python -c "import spork_pds; print('spork_pds loaded successfully')"

      - name: Run tests
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest

      - name: Run vector fuzz tests
        if: runner.os == 'Linux' && matrix.python-version == '3.13'
        run: python -m tests.fuzzing --examples 1000 --steps 200
