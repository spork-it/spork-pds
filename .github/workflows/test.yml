name: Tests

on:
  # Regular branch and pull-request runs use the smaller core matrix below.
  # Tag releases call this workflow with `full: true` from build.yml.
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run the full release test matrix
        required: true
        type: boolean
        default: false
  workflow_call:
    inputs:
      full:
        description: Run the full release test matrix
        required: false
        type: boolean
        default: false

jobs:
  test:
    name: Test on ${{ matrix.os }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Branch and pull-request runs cover the minimum, latest, and
      # free-threaded interpreters on Linux. Releases exercise every supported
      # OS, architecture, and Python version.
      matrix:
        os: ${{ inputs.full && fromJSON('["ubuntu-latest","ubuntu-24.04-arm","windows-latest","windows-11-arm","macos-15-intel","macos-15"]') || fromJSON('["ubuntu-latest"]') }}
        python-version: ${{ inputs.full && fromJSON('["3.10","3.11","3.12","3.13","3.14","3.14t"]') || fromJSON('["3.10","3.14","3.14t"]') }}
        exclude:
          # actions/setup-python does not provide CPython 3.10 for Windows ARM64.
          - os: windows-11-arm
            python-version: "3.10"

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ (endsWith(matrix.os, '-arm') || matrix.os == 'macos-15') && 'arm64' || 'x64' }}
          allow-prereleases: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Build C extension
        run: python setup.py build_ext --inplace

      - name: Print host info
        run: python tools/host_info.py

      - name: Verify native no-GIL import
        if: matrix.python-version == '3.14t'
        env:
          PYTHON_GIL: "0"
        run: >-
          python -m pytest -q
          tests/test_module.py::test_free_threaded_import_keeps_the_gil_disabled

      - name: Verify public namespace and legacy extension load
        env:
          PYTHON_GIL: ${{ matrix.python-version == '3.14t' && '0' || '' }}
        run: python -c "import spork.pds, spork_pds; assert spork.pds.Vector is spork_pds.Vector"

      - name: Run tests
        env:
          PYTHON_GIL: ${{ matrix.python-version == '3.14t' && '0' || '' }}
          PYTHONIOENCODING: utf-8
        run: python -m pytest

      - name: Run free-threading stress suite
        if: matrix.python-version == '3.14t' && runner.os == 'Linux'
        env:
          PYTHON_GIL: "0"
        run: >-
          python tools/stress_free_threading.py --require-no-gil --workers 8
          --publication-rounds 250 --history-steps 250
          --hamt-steps 200 --gc-iterations 250

      - name: Smoke-test synchronization benchmarks
        if: >-
          runner.os == 'Linux' &&
          (matrix.python-version == '3.14' || matrix.python-version == '3.14t')
        env:
          PYTHON_GIL: ${{ matrix.python-version == '3.14t' && '0' || '' }}
        run: >-
          python tools/benchmark_free_threading.py
          --size 512 --repeats 3 --workers 4

      - name: Run vector fuzz tests
        if: >-
          runner.os == 'Linux' &&
          (matrix.python-version == '3.13' || matrix.python-version == '3.14t')
        env:
          PYTHON_GIL: ${{ matrix.python-version == '3.14t' && '0' || '' }}
        run: python -m tests.fuzzing --examples 1000 --steps 200

  docs:
    name: Documentation examples - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ inputs.full && fromJSON('["3.10","3.11","3.12","3.13","3.14","3.14t"]') || fromJSON('["3.14"]') }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Build C extension
        run: python setup.py build_ext --inplace

      - name: Verify documentation examples
        env:
          PYTHON_GIL: ${{ matrix.python-version == '3.14t' && '0' || '' }}
          PYTHONIOENCODING: utf-8
        run: python tools/verify_docs.py

  asan_ubsan:
    name: ASan and UBSan - Python 3.14t
    if: inputs.full
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.14t
        uses: actions/setup-python@v6
        with:
          python-version: "3.14t"
          allow-prereleases: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Build instrumented extension
        run: |
          CC=gcc \
          CFLAGS="-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined" \
          LDFLAGS="-fsanitize=address,undefined" \
          python setup.py build_ext --inplace --force
          runtime="$(gcc -print-file-name=libasan.so)"
          test -f "$runtime"
          echo "LD_PRELOAD=$runtime" >> "$GITHUB_ENV"

      - name: Run tests and stress under ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          PYTHON_GIL: "0"
          PYTHONMALLOC: debug
        run: |
          python -X dev -m pytest
          python -X dev tools/stress_free_threading.py --require-no-gil \
            --workers 8 --publication-rounds 250 --history-steps 250 \
            --hamt-steps 200 --gc-iterations 250

  thread_sanitizer:
    name: ThreadSanitizer - CPython 3.14t
    if: inputs.full
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Check out CPython 3.14.7
        uses: actions/checkout@v5
        with:
          repository: python/cpython
          ref: v3.14.7
          path: .cpython

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Build free-threaded CPython with ThreadSanitizer
        run: |
          mkdir -p "${{ runner.temp }}/cpython-tsan"
          cd "${{ runner.temp }}/cpython-tsan"
          CC=clang "$GITHUB_WORKSPACE/.cpython/configure" \
            --disable-gil --with-pydebug --with-thread-sanitizer
          export TSAN_OPTIONS="suppressions=$GITHUB_WORKSPACE/.cpython/Tools/tsan/suppressions_free_threading.txt:halt_on_error=1:exitcode=66"
          make -j2

      - name: Build ThreadSanitizer-instrumented extension
        run: |
          tsan_python="${{ runner.temp }}/cpython-tsan/python"
          cpython_build="${{ runner.temp }}/cpython-tsan"
          extension_suffix="$($tsan_python -c 'import sysconfig; print(sysconfig.get_config_var("EXT_SUFFIX"))')"
          clang -shared -fPIC \
            -I"$GITHUB_WORKSPACE/.cpython/Include" -I"$cpython_build" \
            -O1 -g -fno-omit-frame-pointer -fsanitize=thread \
            src/common.c src/cons.c src/double_vector.c src/hamt.c \
            src/int_vector.c src/map.c src/module.c src/set.c \
            src/sorted_vector.c src/vector.c \
            -o "spork_pds${extension_suffix}" -fsanitize=thread

      - name: Run no-GIL smoke and stress tests under ThreadSanitizer
        env:
          PYTHONPATH: ${{ github.workspace }}
          TSAN_OPTIONS: suppressions=${{ github.workspace }}/.cpython/Tools/tsan/suppressions_free_threading.txt:halt_on_error=1:exitcode=66
        run: |
          tsan_python="${{ runner.temp }}/cpython-tsan/python"
          env -u PYTHON_GIL "$tsan_python" -W error::RuntimeWarning \
            tools/smoke_installed_distribution.py
          PYTHON_GIL=0 "$tsan_python" tools/stress_free_threading.py \
            --require-no-gil --workers 8 --publication-rounds 250 \
            --history-steps 250 --hamt-steps 200 --gc-iterations 250
